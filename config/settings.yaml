trading:
  mode: paper
  capital: 25000
  max_concurrent_positions: 5
  max_trades_per_day: 10
  candle_interval_minutes: 15
  square_off_time: '15:15'
  # No new positions opened after this time — trades entered too late have
  # little runway before square_off_time and tend to get flattened at a small
  # loss regardless of signal quality. Existing open positions are unaffected.
  new_entry_cutoff_time: '13:00'
  market_open: 09:15
  market_close: '15:30'
  # Master switch for automatic order placement. When false (default), the
  # bot only sends Telegram alerts with entry/SL/target — nothing is placed.
  # Flip to true only after you've validated alert quality over live paper/
  # real sessions. Even when true, trading.mode still governs paper vs. live
  # fills inside OrderManager.
  auto_execute: true
  # TEMP: keep the live feed running after square-off so we can debug WebSocket
  # outside market hours. Set back to false for normal sessions.
  allow_after_hours: false
  # Opt-in: when all max_concurrent_positions slots are full and a new signal
  # arrives with confidence >= rotation_min_confidence, close the weakest open
  # position (the one closest to hitting its own stop-loss) to free a slot for
  # it, instead of just skipping the new setup. Off by default — test in paper
  # mode first, since forcing an early exit has real opportunity-cost risk.
  allow_position_rotation: true
  rotation_min_confidence: 92
risk:
  per_trade_risk_pct: 1.0
  daily_loss_limit_pct: 2.0
  max_consecutive_losses: 4
  atr_stop_multiplier: 1.5
  atr_target_multiplier: 3.0
strategy:
  name: ORBEMAVWAPStrategy
  orb_minutes: 15
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  atr_period: 14
  vwap_filter: true
  min_confidence: 75         # skip entries scoring below this (default was 70, the bare-minimum threshold)
  # Risk management add-ons (all optional, safe defaults preserve old behavior)
  breakeven_r: 1.0           # move stop to breakeven once price moves 1R in our favor
  trail_atr_mult: 1.0        # once breakeven, trail stop by 1x ATR behind price
  max_holding_candles: 8     # force exit after 8 candles (2 hours on 15-min bars) if still open
  early_cut_candles: 3       # if still below early_cut_min_r after 3 candles, cut early (frees capital instead of waiting out max_holding_candles)
  early_cut_min_r: 0.3       # R-multiple threshold below which a trade is considered stalled
  min_atr_pct: 0.15          # skip entries when ATR/close% is below this (too illiquid/choppy)
  max_atr_pct: 3.0           # skip entries when ATR/close% is above this (news/event volatility)
  min_adx: 15                # regime filter: skip entries when ADX is below this (choppy/non-trending); 0 = disabled
  min_ema_trend_factor: 8    # skip entries when the ema_trend confidence sub-factor (/20) is below this — filters out "high total score but no real trend yet" setups that the additive scoring can mask
